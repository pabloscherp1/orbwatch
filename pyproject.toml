[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbwatch"
version = "0.1.0"
description = "Satellite tracking and manoeuvre detection from public orbital data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pablo Scherpereel Arce" }]
keywords = ["astrodynamics", "sgp4", "space domain awareness", "manoeuvre detection"]
dependencies = [
    "numpy>=1.26",
    "sgp4>=2.23",
    "matplotlib>=3.8",
    # Mozilla CA bundle. The python.org macOS installer ships without a usable
    # certificate store, so stdlib HTTPS fails there until something supplies one.
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
# astropy is an independent reference the tests check frames and the Sun against.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "astropy>=6.0",
]

[project.urls]
Repository = "https://github.com/pabloscherp1/orbwatch"

[project.scripts]
orbwatch-gui = "orbwatch.gui.server:main"

[tool.setuptools.packages.find]
include = ["orbwatch*"]

[tool.setuptools.package-data]
"orbwatch.gui" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: hits the public internet, deselect with -m 'not network'",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
